name: CI - Todo App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Permet de reconstruire l'image frontend avec une autre URL d'API (déploiement Railway, etc.)
  workflow_dispatch:
    inputs:
      next_public_api_url:
        description: "URL publique de l'API inlinée dans l'image frontend (ex: https://api-xxx.up.railway.app/api)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Backend
        working-directory: ./backend
        run: mvn -B clean package -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      # Le préfixe -p fixe les noms d'images : taskly-backend / taskly-frontend
      # NEXT_PUBLIC_API_URL est inliné au build : vide en push classique, fourni en workflow_dispatch
      - name: Build Docker images
        env:
          NEXT_PUBLIC_API_URL: ${{ github.event.inputs.next_public_api_url }}
        run: docker compose -p taskly build

      - name: Push images to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN absents : publication ignorée."
            exit 0
          fi
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker tag taskly-backend:latest "$DOCKERHUB_USERNAME/taskly-backend:latest"
          docker tag taskly-frontend:latest "$DOCKERHUB_USERNAME/taskly-frontend:latest"
          docker push "$DOCKERHUB_USERNAME/taskly-backend:latest"
          docker push "$DOCKERHUB_USERNAME/taskly-frontend:latest"
