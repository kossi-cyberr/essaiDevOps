server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: todo-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/todo_db}
    username: ${DB_USERNAME:todo_user}
    password: ${DB_PASSWORD:todo_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # En développement, Hibernate crée / met à jour le schéma automatiquement.
      # En production, préférez `validate` avec des migrations Flyway/Liquibase.
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    default-property-inclusion: non_null

# Configuration métier de l'application
app:
  jwt:
    # Le secret doit contenir au moins 32 caractères (256 bits pour HS256).
    # En production, fournissez-le via la variable d'environnement JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-super-secret-key-change-me-in-production-please-32chars-min}
    # Durée de vie du token : 24 heures par défaut (en millisecondes)
    expiration: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    com.example.todo: INFO
    org.springframework.security: WARN
